name: AUTO Render My Own Heart FIXED AT 33S

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "render_fixed_33.py"
      - "MyOwnHeart_Lyrics.txt"
      - ".github/workflows/render-my-own-heart.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install forced-alignment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install whisperx

      - name: Render with verse hard-anchored at 33 seconds
        run: python render_fixed_33.py

      - name: Publish unmistakable 33-second version
        run: |
          mkdir -p generated
          cp My_Own_Heart_FIXED_AT_33_SECONDS.mp4 generated/My_Own_Heart_FIXED_AT_33_SECONDS.mp4
          cp my_own_heart_fixed_33_timings.json generated/My_Own_Heart_FIXED_AT_33_SECONDS_timings.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/My_Own_Heart_FIXED_AT_33_SECONDS.mp4 generated/My_Own_Heart_FIXED_AT_33_SECONDS_timings.json
          git commit -m "Publish My Own Heart anchored at 33 seconds [skip ci]" || exit 0
          git push

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: My-Own-Heart-FIXED-AT-33-SECONDS
          path: |
            generated/My_Own_Heart_FIXED_AT_33_SECONDS.mp4
            generated/My_Own_Heart_FIXED_AT_33_SECONDS_timings.json
            my_own_heart_fixed_33.ass
          if-no-files-found: error
          retention-days: 7
