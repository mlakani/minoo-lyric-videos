name: Render My Own Heart Lyric Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper==1.1.1

      - name: Synchronize lyrics and render video
        run: python synchronize_lyrics.py

      - name: Upload finished synchronized video
        uses: actions/upload-artifact@v4
        with:
          name: My-Own-Heart-Synchronized-Video
          path: |
            My_Own_Heart_Synchronized.mp4
            my_own_heart_timings.json
            my_own_heart.ass
          if-no-files-found: error
          retention-days: 7
